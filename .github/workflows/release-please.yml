name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      # "true" only on the push that actually publishes a release; gates the package job.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Config and manifest files rather than inline inputs, so version bumps of extra files
      # (CMakeLists.txt) are declared in one reviewed place: release-please-config.json.
      # A GitHub App token, not GITHUB_TOKEN: GitHub starts no workflows for events made with
      # GITHUB_TOKEN, so the release PR it opened never got its required checks.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the release zip in the SAME run, gated on release_created, so the asset is attached by
  # the run that created the release.
  # Building and publishing are separate jobs so the toolchain image, which gets a writable mount of
  # the checkout, never shares a job with the release-write and signing credentials.
  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-24.04
    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The same command as a local release build: the Skiff toolchain image builds the EBOOT and
      # collects the licences, then scripts/package.sh zips them into dist/.
      - name: Build and package the release
        id: package
        run: |
          scripts/dev.sh package
          shopt -s nullglob
          archives=(dist/skiff-*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::expected exactly one archive in dist/, found ${#archives[@]}"
            exit 1
          fi
          echo "archive_name=$(basename "${archives[0]}")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive
          path: dist/${{ steps.package.outputs.archive_name }}
          if-no-files-found: error

  # Runs no repository code: it only signs and uploads the archive the package job produced.
  publish:
    needs: [release-please, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless Sigstore signing for the build-provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archive
      # Verify with: gh attestation verify skiff-<version>.zip --repo chiva/skiff
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.package.outputs.archive_name }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ARCHIVE: ${{ needs.package.outputs.archive_name }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
