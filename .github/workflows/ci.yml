name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run meaningless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The same hook set developers run locally (.pre-commit-config.yaml), so a commit that passed
      # its hooks cannot fail here. commit-msg hooks do not run on --all-files; PR titles are
      # checked by the commit-lint job instead.
      - run: pipx run pre-commit==4.6.2 run --all-files --show-diff-on-failure

  # The same scripts/dev.sh commands developers run, in the same docker/host.Dockerfile image, so a
  # green local run means a green job. The compiler matrix (gcc, clang) and the coverage floor live
  # in scripts/dev.sh; the compiler check in scripts/host-tests.sh fails a run whose CMake picked
  # the wrong compiler.
  host:
    name: Host ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check:
          - { command: test, name: "tests (gcc, clang)" }
          - { command: asan, name: "tests under ASan + UBSan (gcc, clang)" }
          - { command: coverage, name: "coverage (≥85% lines)" }
          - { command: lint, name: "static analysis (clang-tidy, cppcheck)" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/dev.sh ${{ matrix.check.command }}
      - if: matrix.check.command == 'coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: build/host-coverage/coverage.xml

  # Builds in the Skiff toolchain image (docker/toolchain.Dockerfile) through scripts/dev.sh, like
  # local builds. The image compiles mbedtls and curl natively here in about two minutes.
  psp-build:
    name: PSP build (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [psp, psp-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/dev.sh ${{ matrix.preset }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eboot-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/pbp/
          if-no-files-found: error

  # The job name is a required status check in the main ruleset; add steps rather than renaming it.
  emulator:
    name: Emulator self-test (PPSSPPHeadless)
    needs: psp-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eboot-psp
          path: build/psp/pbp/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Compiling PPSSPP takes ~15 minutes; the GHA layer cache makes every run after the first
      # (until docker/ppsspp.Dockerfile changes) a cache hit.
      - name: Build PPSSPPHeadless image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker
          file: docker/ppsspp.Dockerfile
          load: true
          tags: skiff-ppsspp:ci
          cache-from: type=gha,scope=ppsspp
          cache-to: type=gha,mode=max,scope=ppsspp
      - name: Run the self-test EBOOT
        run: >-
          docker run --rm -v "$PWD":/src -w /src skiff-ppsspp:ci
          tests/emulator/run_eboot.sh build/psp/pbp/skiff_selftest/EBOOT.PBP SELFTEST
      - name: Run the TLS toolchain probe EBOOT
        run: >-
          docker run --rm -v "$PWD":/src -w /src skiff-ppsspp:ci
          tests/emulator/run_eboot.sh build/psp/pbp/skiff_tls_probe/EBOOT.PBP "TLS PROBE"
      # PPSSPP has no ARK, so the KIRK probe checks that Skiff's real entropy hook refuses there.
      - name: Run the KIRK probe EBOOT (no ARK, TLS must refuse)
        run: >-
          docker run --rm -v "$PWD":/src -w /src skiff-ppsspp:ci
          tests/emulator/run_eboot.sh build/psp/pbp/skiff_kirk_probe/EBOOT.PBP "KIRK PROBE NO ARK"
      # Same without ARK: the network modules must load and unload, and TLS must refuse to start.
      - name: Run the network probe EBOOT (no ARK, modules load, TLS must refuse)
        run: >-
          docker run --rm -v "$PWD":/src -w /src skiff-ppsspp:ci
          tests/emulator/run_eboot.sh build/psp/pbp/skiff_net_probe/EBOOT.PBP "NET PROBE NO ARK"
      # Without ARK the benchmark checks that TLS refuses, then runs its CRC-32 and Memory Stick code.
      - name: Run the benchmark EBOOT (no ARK, CRC-32 and Memory Stick code only)
        run: >-
          docker run --rm -v "$PWD":/src -w /src skiff-ppsspp:ci
          tests/emulator/run_eboot.sh build/psp/pbp/skiff_bench/EBOOT.PBP "BENCH NO ARK"
      # Without ARK the resume probe checks the PSP storage downloads write through, then that TLS
      # refuses; the interruptions need a real PSP.
      - name: Run the resume probe EBOOT (no ARK, storage code only)
        run: >-
          docker run --rm -v "$PWD":/src -w /src skiff-ppsspp:ci
          tests/emulator/run_eboot.sh build/psp/pbp/skiff_resume_probe/EBOOT.PBP "RESUME PROBE NO ARK"
      # Nobody presses a button in PPSSPPHeadless, so the UI prototype checks its fonts and frames, then
      # exits on its own; the keyboard and network picker need a real PSP.
      - name: Run the UI prototype EBOOT (headless, fonts and frames)
        run: >-
          docker run --rm -v "$PWD":/src -w /src skiff-ppsspp:ci
          tests/emulator/run_eboot.sh build/psp/pbp/skiff_ui_proto/EBOOT.PBP "UI PROTO HEADLESS"

  # The disposable RomM behind a TLS proxy (tests/integration/) that the network probe and the
  # integration tests use: started and checked through scripts/dev.sh, as locally. romm-test then
  # runs the host build's transport against it (TLS, mTLS, the PSP-clock rule, resuming).
  integration:
    name: Integration server (RomM behind TLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/dev.sh romm-up romm-check romm-test
      - name: Show the server logs
        if: failure()
        run: >-
          docker compose -f tests/integration/compose.yaml --env-file build/integration/romm.env
          logs --no-color --tail 200
      - run: scripts/dev.sh romm-down
        if: always()

  commit-lint:
    name: Conventional commit PR title
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    # The top-level permissions grant only contents:read; this action reads the PR to check its title.
    permissions:
      pull-requests: read
    # Squash merge is the only merge method, so the PR title becomes the commit release-please reads.
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
